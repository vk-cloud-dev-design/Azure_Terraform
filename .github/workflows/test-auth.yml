name: Test Azure OIDC Authentication & Terraform

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches: [ "main" ]

permissions:
  id-token: write # Required for requesting the OIDC JWT token
  contents: read  # Required for actions/checkout

jobs:
  test-azure-auth:
    name: Validate Azure Connection & Terraform
    runs-on: ubuntu-latest
    #environment: Dev Environment # Must match your GitHub Environment name exactly

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure CLI Access
        run: |
          echo "Connected successfully to Azure!"
          az account show --output table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init & Plan (OIDC Test)
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init
          terraform plan
